services:
  arceus_db:
    image: postgres
    ports:
      - "5432:5432"
    container_name: arceus_db
    restart: always
    environment:
      - POSTGRES_DB=${PG_DB}
      - POSTGRES_PASSWORD=${PG_PASS}
      - POSTGRES_USER=${PG_USER}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - arceus_net
  arceus_api:
    image: zolppy/arceus_api:latest
    container_name: arceus_api
    environment:
      - SEVEN_AZ_API_KEY=${SEVEN_AZ_API_KEY}
      - SEVEN_AZ_BASE_API_URL=${SEVEN_AZ_BASE_API_URL}
      - IXC_ACCESS_TOKEN=${IXC_ACCESS_TOKEN}
      - IXC_BASE_API_URL=${IXC_BASE_API_URL}
      - OPA_ACCESS_TOKEN=${OPA_ACCESS_TOKEN}
      - OPA_BASE_API_URL=${OPA_BASE_API_URL}
      - IXC_ACS_BASE_API_URL=${IXC_ACS_BASE_API_URL}
      - IXC_ACS_CLIENT_ID=${IXC_ACS_CLIENT_ID}
      - IXC_ACS_CLIENT_SECRET=${IXC_ACS_CLIENT_SECRET}
      - DB_URL_SYNC=${DB_URL_SYNC}
      - DB_URL_ASYNC=${DB_URL_ASYNC}
      - DFLT_USER_EMAIL=${DFLT_USER_EMAIL}
      - DFLT_USER_NAME=${DFLT_USER_NAME}
      - DFLT_USER_PASS=${DFLT_USER_PASS}
      - BOT_PASS=${BOT_PASS}
      - BOT_USERNAME=${BOT_USERNAME}
      - TOKEN_EXPIRE_MINUTES=${TOKEN_EXPIRE_MINUTES}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS}
      - SECRET_KEY=${SECRET_KEY}
      - RUN_MIGRATIONS=${RUN_MIGRATIONS}
    ports:
      - 8000:8000
    depends_on:
      - arceus_db
    networks:
      - arceus_net
    volumes:
      - ./src:/src/src
      - ./pyproject.toml:/src/pyproject.toml
      - ./uv.lock:/src/uv.lock
      - media:/src/media
volumes:
  pgdata:
    driver: local
  media:
    driver: local
networks:
  arceus_net:
    driver: bridge
