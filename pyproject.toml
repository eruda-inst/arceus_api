description = "Simplifica integrações entre a API da OpaSuite, IXCSoft e 7AZ."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.2",
    "asyncpg>=0.31.0",
    "fastapi>=0.123.5",
    "httpx>=0.28.1",
    "psycopg>=3.3.3",
    "psycopg-binary>=3.3.3",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.12.0",
    "pydantic[email]>=2.12.5",
    "ruff>=0.15.7",
    "sqlalchemy>=2.0.44",
    "uvicorn>=0.38.0",
]
